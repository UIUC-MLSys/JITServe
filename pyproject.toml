[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jitserve"
version = "0.1.0"
description = "JITServe: SLO-aware LLM Serving with Imprecise Request Information"
readme = "README.md"
requires-python = ">=3.9"

authors = [
  { name = "Wei Zhang", email = "zhangw2@illinois.edu" },
  { name = "Zhiyu Wu", email = "zhiyuwu2@illinois.edu" }
]

license = { text = "Apache-2.0" }

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

dependencies = [
    "huggingface-hub>=0.36.2",
    "joblib>=1.4.2",
    "quantile-forest>=1.3.9",
    # The QRF predictors in assets/ were pickled with scikit-learn 1.5.1.
    "scikit-learn==1.5.1",
    # vLLM's outlines dependency otherwise resolves to datasets 1.1.1, which
    # fails to import with current pyarrow and crashes the benchmark client.
    "datasets>=3,<4",
    "transformers==4.47.0",
    "aiohttp",
    "uvicorn",
]
