[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jitserve"
version = "0.1.0"
description = "JITServe: SLO-aware LLM Serving with Imprecise Request Information"
readme = "README.md"
requires-python = ">=3.8"

authors = [
  { name = "Wei Zhang", email = "zhangw2@illinois.edu" },
  { name = "Zhiyu Wu", email = "zhiyuwu2@illinois.edu" }
]

license = { text = "Apache-2.0" }

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

dependencies = []